<main><h1>#827 界面预览</h1><p class="m">commit 1155c3b · <a href="https://github.com/yetone/magpie/pull/827">回到 PR</a> · 这个 PR 把 Aside「接入 magpie 提供方」和「选模型」在界面上拆成两件事：Agent 行/详情会显示 Aside 的运行状态和单个字段的说明，读取不到运行时会弹出「保存供下次启动使用」的确认，断开前先用纯计划做还原预览并且预览失败就禁止断开，同时补了中/日/德文案。</p>
